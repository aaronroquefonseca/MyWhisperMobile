name: iOS

on:
  push:
    branches: [feat/ios-keyboard-prototype]
    paths: [ios/**, core/**, .github/workflows/ios.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Rust iOS targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Select Xcode 26
        run: |
          ls /Applications | grep -i xcode
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=/Applications/Xcode.app; fi
          echo "Using $XCODE"
          sudo xcode-select --switch "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build core xcframework
        run: ./scripts/build-core-ios.sh

      - name: Archive (unsigned)
        run: >
          xcodebuild -project ios/MyWhisper.xcodeproj
          -scheme MyWhisper -configuration Release
          -destination "generic/platform=iOS"
          -archivePath build/MyWhisper.xcarchive
          CODE_SIGNING_ALLOWED=NO archive

      - name: Package unsigned IPA
        run: |
          cd build
          rm -rf Payload MyWhisper-unsigned-icon.ipa
          mkdir Payload
          cp -R MyWhisper.xcarchive/Products/Applications/MyWhisper.app Payload/
          zip -qry MyWhisper-unsigned-icon.ipa Payload
          ls -l MyWhisper-unsigned-icon.ipa
          unzip -l MyWhisper-unsigned-icon.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyWhisper-unsigned-icon
          path: build/MyWhisper-unsigned-icon.ipa
          if-no-files-found: error

      - name: Simulator screenshots (glass check)
        run: |
          xcodebuild -project ios/MyWhisper.xcodeproj \
            -scheme MyWhisper -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build
          APP=$(ls -d "$PWD"/build/sim/Build/Products/Debug-iphonesimulator/MyWhisper.app)
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          devs = json.load(sys.stdin)['devices']
          for runtime, ds in devs.items():
              for d in ds:
                  if d['name'] == 'iPhone 17 Pro' and d['availability'] == '(available)':
                      print(d['udid']); raise SystemExit
          ")
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl install "$UDID" "$APP"
          shot() {
            xcrun simctl launch --terminate-running-process "$UDID" com.mywhisper.mobile "$@" >/dev/null
            sleep 5
            xcrun simctl io "$UDID" screenshot "build/sim-$1.png"
          }
          shot record -mwSkipOnboarding
          shot speech -mwSkipOnboarding -mwTab speech
          shot history -mwSkipOnboarding -mwTab history
          shot setup -mwSkipOnboarding -mwTab setup
          ls -l build/sim-*.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sim-screenshots
          path: build/sim-*.png
          if-no-files-found: error
