name: release

# Stable: tag push (android-v*) builds the signed APK, creates the GitHub
# release with the android/CHANGELOG.md section, and hands the APK to the F-Droid
# repo (uploads to R2 incoming/, then starts aaronroquefonseca/fdroid's publish).
# Nightly: every push to main does the same with the `nightly` build type,
# replaces the rolling `nightly` GitHub prerelease, and syncs the F-Droid
# listing (fastlane/metadata/android). F-Droid marks nightlies as Beta.
# Manual re-run of a stable release via workflow_dispatch with an existing tag
# (android-vX.Y.Z, or vX.Y.Z for releases up to 1.4.0).
# The on-device AI runtime pack is NOT in the APK: it is published once per
# build-input hash as its own prerelease (tag localai-<hash>) and the APK
# pins its URL + SHA-256; the app downloads it with the first local model.
on:
  push:
    tags: ["android-v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (e.g. android-v1.5.0)
        type: string
        required: true

permissions:
  contents: write # create GitHub Releases, upload APKs, move the nightly tag

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  # A newer push to main supersedes a running nightly; never cancel a stable.
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' && !inputs.tag }}

env:
  PACKAGE: com.mywhisper.mobile

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve channel and version
        working-directory: ${{ github.workspace }}
        env:
          REF_TYPE: ${{ inputs.tag && 'tag' || github.ref_type }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          GRADLE_VERSION="$(grep '^mywhisper\.versionName=' android/gradle.properties | cut -d= -f2 | tr -d ' ')"
          test -n "$GRADLE_VERSION"
          if [[ "$REF_TYPE" == tag ]]; then
            VERSION="${TAG#android-}"; VERSION="${VERSION#v}"
            if [[ "$GRADLE_VERSION" != "$VERSION" ]]; then
              echo "tag $TAG != gradle versionName $GRADLE_VERSION" >&2; exit 1
            fi
            if ! grep -q "^## \\[$VERSION\\]" android/CHANGELOG.md; then
              echo "android/CHANGELOG.md lacks a [${VERSION}] section (only Unreleased?)" >&2; exit 1
            fi
            awk -v ver="$VERSION" 'index($0, "## [" ver "]") == 1 {flag=1; next} /^## / {flag=0} flag' android/CHANGELOG.md | sed -e '/^[[:space:]]*$/d' > notes.md
            test -s notes.md || { echo "empty notes for $TAG" >&2; exit 1; }
            { echo "CHANNEL=stable"; echo "BUILD_TYPE=Release"; echo "NIGHTLY_NUMBER=0"; } >> "$GITHUB_ENV"
          else
            # Nightly number = commits since the release number was last bumped,
            # +1 so a nightly never equals the stable build of the same release.
            BUMP="$(git log -1 --format=%H -G'^mywhisper\.versionCode=' -- android/gradle.properties)"
            NIGHTLY_NUMBER=$(( $(git rev-list --count "$BUMP..HEAD") + 1 ))
            { echo "CHANNEL=nightly"; echo "BUILD_TYPE=Nightly"; echo "NIGHTLY_NUMBER=$NIGHTLY_NUMBER"; } >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # v4 has no api-level/build-tools/ndk/cmake inputs (packages only);
          # same SDK set expressed as sdkmanager specs.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action
        with:
          toolchain: 1.99.0
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core
      - name: Install cargo-ndk
        working-directory: core
        run: cargo install --locked cargo-ndk --version 4.1.2
      - name: On-device AI runtime pack (reuse or build + publish)
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PACK_ID="localai-$(cat scripts/build-localai.sh $(git ls-files android/localai | sort) | sha256sum | cut -c1-12)"
          ASSET="${PACK_ID}-arm64-v8a.zip"
          mkdir -p dist-pack
          if ! gh release download "$PACK_ID" -p "$ASSET" -D dist-pack 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends glslc spirv-tools ninja-build
            bash scripts/build-localai.sh
            (cd build/localai/lib && zip -q -9 -X "$GITHUB_WORKSPACE/dist-pack/$ASSET" ./*.so)
            # A concurrent run may have published the same inputs first: use theirs.
            gh release create "$PACK_ID" "dist-pack/$ASSET" --prerelease --target "$GITHUB_SHA" \
              --title "On-device AI runtime ${PACK_ID#localai-}" \
              --notes "llama.cpp + whisper.cpp runtime for MyWhisper's on-device models (arm64-v8a). Downloaded by the app; not meant for manual install." \
              || { rm -f "dist-pack/$ASSET"; gh release download "$PACK_ID" -p "$ASSET" -D dist-pack; }
          fi
          SHA="$(sha256sum "dist-pack/$ASSET" | cut -d' ' -f1)"
          SIZE="$(stat -c%s "dist-pack/$ASSET")"
          URL="https://github.com/${GH_REPO}/releases/download/${PACK_ID}/${ASSET}"
          echo "LOCALAI_PROPS=-Pmywhisper.localai.id=$PACK_ID -Pmywhisper.localai.url=$URL -Pmywhisper.localai.sha256=$SHA -Pmywhisper.localai.size=$SIZE" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Restore release keystore
        env:
          MYWHISPER_KEYSTORE_B64: ${{ secrets.MYWHISPER_KEYSTORE_B64 }}
        run: echo "$MYWHISPER_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Assemble signed APK
        env:
          MYWHISPER_KEYSTORE_PASSWORD: ${{ secrets.MYWHISPER_KEYSTORE_PASSWORD }}
          MYWHISPER_KEY_ALIAS: ${{ secrets.MYWHISPER_KEY_ALIAS }}
          MYWHISPER_KEY_PASSWORD: ${{ secrets.MYWHISPER_KEY_PASSWORD }}
        run: |
          MYWHISPER_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore" ./gradlew \
            ":app:assemble${BUILD_TYPE}" $LOCALAI_PROPS \
            "-Pmywhisper.nightlyNumber=${NIGHTLY_NUMBER}"
      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - name: Collect APKs
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          BT="${BUILD_TYPE,}"
          OUT=android/app/build/outputs/apk
          META="$OUT/$BT/output-metadata.json"
          VERSION_NAME="$(jq -r '.elements[0].versionName' "$META")"
          VERSION_CODE="$(jq -r '.elements[0].versionCode' "$META")"
          mkdir -p dist
          mv "$OUT/$BT/app-$BT.apk" "dist/MyWhisper-${VERSION_NAME}.apk"
          { echo "VERSION_NAME=$VERSION_NAME"; echo "VERSION_CODE=$VERSION_CODE"; } >> "$GITHUB_ENV"
          ls -l dist
      - name: Create GitHub Release
        if: env.CHANNEL == 'stable'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ARGS=(--title "$TAG" --notes-file notes.md)
          # Prerelease only for a version suffix (1.5.0-beta.1); the android- prefix has a dash too.
          VERSION="${TAG#android-}"
          [[ "$VERSION" == *-* ]] && ARGS+=(--prerelease)
          gh release create "$TAG" dist/*.apk "${ARGS[@]}"
      - name: Replace rolling nightly prerelease
        if: env.CHANNEL == 'nightly'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          LAST_TAG="$(git describe --tags --abbrev=0 --match 'android-v*' --match 'v*' 2>/dev/null || true)"
          {
            echo "Nightly build ${VERSION_NAME} (versionCode ${VERSION_CODE}) from ${GITHUB_SHA::7}."
            echo
            echo "Installs over the stable app (same package) and keeps your settings."
            echo "On-device models download their runtime on first use."
            echo
            echo "Changes since ${LAST_TAG:-the first commit}:"
            git log --format='- %s' --no-merges ${LAST_TAG:+"$LAST_TAG..HEAD"} | head -50
          } > nightly-notes.md
          gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
          gh release create nightly dist/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Nightly ${VERSION_NAME}" --notes-file nightly-notes.md
      - name: Hand the APK and listing to the F-Droid repo
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          R2=(--endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --only-show-errors)
          LISTING="s3://${R2_BUCKET}/listings/${PACKAGE}"
          if [[ "$CHANNEL" == nightly ]]; then
            # Store text, icon, screenshots; symlinks are followed. changelogs/
            # holds per-release "What's new" written on stable; keep it.
            aws s3 sync fastlane/metadata/android "$LISTING" --delete --exclude '*/changelogs/*' "${R2[@]}"
          else
            aws s3 cp notes.md "$LISTING/en-US/changelogs/${VERSION_CODE}.txt" "${R2[@]}"
          fi
          # fdroid's canonical file name; the repo treats versionCode % 1000 != 0 as nightly.
          aws s3 cp "dist/MyWhisper-${VERSION_NAME}.apk" "s3://${R2_BUCKET}/incoming/${PACKAGE}_${VERSION_CODE}.apk" "${R2[@]}"
      - name: Publish the F-Droid repo
        env:
          # Fine-grained token: aaronroquefonseca/fdroid only, Actions read/write.
          GH_TOKEN: ${{ secrets.FDROID_DISPATCH_TOKEN }}
        run: gh workflow run publish.yml -R aaronroquefonseca/fdroid
