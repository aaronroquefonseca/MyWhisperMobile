[package]
name = "mywhisper-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "mywhisper_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "rustls", "webpki-roots"] }
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# Outbound TLS: rustls + bundled Mozilla roots (see tls.rs for why the
# reqwest default verifier cannot be used on Android).
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
webpki-roots = "1"
base64 = "0.23"
sha2 = "0.10"
getrandom = "0.4"
snow = "0.10"
mdns-sd = "0.21"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
unicode-normalization = "0.1"

# ANDROID PORT: bundled-sqlcipher needs OpenSSL headers the NDK does not
# ship, so Android builds use plaintext `bundled` for now (app sandbox
# still isolates the file; the Keystore key is kept for the cipher
# switch — see core/README.md). Host keeps bundled-sqlcipher.
# IOS PORT: same constraint on iOS (Xcode ships no OpenSSL headers),
# so Apple targets use plaintext `bundled` too (app sandbox still
# isolates the file; the Keychain key is reserved for the cipher
# switch). Host (non-Android, non-iOS) keeps bundled-sqlcipher.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rusqlite = { version = "0.40", features = ["bundled", "bundled-sqlcipher"] }

# IOS PORT: keyring is host-only. It does not compile for iOS
# (apple-native-keyring-store compile_errors without its `protected`
# feature), and it is dead code there anyway: Swift always passes the
# Keychain key via MYWHISPER_DB_KEY (see store.rs db_key).
[target.'cfg(all(not(target_os = "android"), not(target_os = "ios")))'.dependencies]
keyring = "4.2.0"

# APK SLIM: squeeze the JNI .so (libmywhisper_core.so is ~12MB/arch
# unoptimized). LTO + size-opt + symbol strip + single codegen unit.
[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1
